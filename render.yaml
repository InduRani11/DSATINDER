services:
  # Backend API Web Service
  - type: web
    name: dsatinder-backend
    env: node
    rootDir: server
    buildCommand: npm install && npm run build && npx prisma generate && npx prisma db push
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        value: file:./dev.db
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 5000
      - key: ADMIN_SECRET
        value: algorank_admin_2026

  # Frontend Web Service (Static Site)
  - type: web
    name: dsatinder-frontend
    env: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: dsatinder-backend
          property: host
